{{define "history"}}{{template "head" .}}
<section class="team-head">
  <h1>Histórico <span class="muted" id="histCount">(0)</span></h1>
  <button id="histClear" class="btn btn--ghost" type="button" hidden>Limpar</button>
</section>

<div id="histEmpty" class="empty empty--lg" hidden>
  <strong>Nenhuma consulta ainda.</strong>
  <span>Abra qualquer Pokémon na <a href="{{.BaseURL}}">Pokédex</a> — ele aparece aqui.</span>
</div>

<div id="history" class="history"></div>

<script defer src="static/js/history.js"></script>
{{template "foot" .}}{{end}}
